            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRiskDecisionList'
          description: ''
  /admin/transfers/{id}/reverse/:
    post:
      operationId: admin_transfers_reverse_create
      summary: Administratively reverse a completed transfer using compensating ledger
        entries
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique client idempotency token
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Reversals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferReversalRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransferReversalRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransferReversalRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
          description: ''
        '400':
          description: Transfer cannot be reversed or recipient has insufficient funds
        '403':
          description: Staff permission required
  /admin/wallets/{id}/close/:
    post:
      operationId: admin_wallets_close_create
      summary: Administratively permanently close a wallet
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Wallets
      requestBody:
        content:
          application/json:
