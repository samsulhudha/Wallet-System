        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: start_date
        schema:
          type: string
        description: Filter from ISO datetime
      - in: query
        name: transaction_type
        schema:
          type: string
        description: Filter by transaction type (TOPUP, TRANSFER, etc.)
      tags:
      - Statements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
