openapi: 3.0.3
info:
  title: Enterprise Wallet & Ledger Service API
  version: 1.0.0
  description: High-concurrency, double-entry financial wallet service featuring PostgreSQL
    row-level locking, immutable double-entry ledger, idempotency protection, daily
    limits, pluggable fraud engine, asynchronous mock banking with callback verification,
    and complete audit trail.
paths:
  /admin/flags/:
    get:
      operationId: admin_flags_list
      summary: List all flagged or blocked transactions requiring risk review
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Admin - Risk
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRiskDecisionList'
          description: ''
  /admin/risk/flagged/:
    get:
      operationId: admin_risk_flagged_list
      summary: List all flagged or blocked transactions requiring risk review
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
