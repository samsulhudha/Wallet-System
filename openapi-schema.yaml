          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankCallbackPayloadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankCallbackPayloadRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Callback processed or duplicate ignored
        '400':
          description: Invalid signature or malformed payload
  /api/transfers/:
    post:
      operationId: api_transfers_create
      summary: Execute an atomic P2P transfer between two wallets (Requires Idempotency-Key
