      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
          description: ''
        '400':
          description: Insufficient balance, daily limit exceeded, or validation error
        '403':
          description: Fraud risk rule blocked transfer
        '409':
          description: Idempotency key collision with different payload
