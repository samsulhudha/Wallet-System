  /api/wallets/{id}/transactions/:
    get:
      operationId: api_wallets_transactions_list
      summary: Retrieve ledger-backed transaction statement for a wallet
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: Filter to ISO datetime
      - in: path
        name: id
        schema:
